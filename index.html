<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Pi - Premium</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
  Pi.init({ version: "2.0", sandbox: false });
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:linear-gradient(135deg,#1a0033,#6a11cb,#2575fc);min-height:100vh;color:white;font-family:system-ui;padding:20px;display:flex;justify-content:center;align-items:center}
 .app{width:100%;max-width:380px;background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border-radius:30px;padding:25px;box-shadow:0 20px 60px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.2)}
 .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
 .logo{font-weight:900;font-size:22px}
 .pi-badge{background:#ffcc00;color:#000;padding:6px 12px;border-radius:20px;font-weight:700;font-size:12px}
 .cover{width:100%;aspect-ratio:1;background:linear-gradient(45deg,#ff00cc,#3333ff);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:20px;box-shadow:0 15px 35px rgba(0,0,0,0.3)}
 .info{text-align:center;margin-bottom:20px}
 .title{font-size:20px;font-weight:800;margin-bottom:5px}
 .artist{opacity:0.7;font-size:14px}
 .progress{width:100%;height:6px;background:rgba(255,255,255,0.2);border-radius:10px;margin:20px 0;overflow:hidden}
 .bar{width:35%;height:100%;background:#fff;border-radius:10px}
 .controls{display:flex;justify-content:space-around;align-items:center;margin:25px 0}
 .btn{width:50px;height:50px;border-radius:50%;border:none;background:rgba(255,255,255,0.15);color:white;font-size:20px;cursor:pointer}
 .btn-play{width:70px;height:70px;background:white;color:#6a11cb;font-size:30px;box-shadow:0 10px 25px rgba(0,0,0,0.3)}
 .playlist{margin-top:10px}
 .track{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:rgba(255,255,255,0.08);border-radius:15px;margin-bottom:10px;cursor:pointer}
 .track.active{background:rgba(255,255,255,0.2);border:1px solid white}
  #piPayBtn{width:100%;background:linear-gradient(90deg,#ffcc00,#ff9900);color:#000;padding:16px;border-radius:15px;border:none;font-weight:900;font-size:15px;cursor:pointer;margin-top:20px;box-shadow:0 8px 20px rgba(255,204,0,0.4)}
  #loginBtn{width:100%;background:white;color:#6a11cb;padding:14px;border-radius:15px;border:none;font-weight:800;margin-bottom:15px;cursor:pointer}
 .status{text-align:center;font-size:12px;opacity:0.8;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">🎵 Music Pi</div>
    <div class="pi-badge">Pi TESTNET</div>
  </div>

  <div class="cover" id="cover">🎧</div>

  <div class="info">
    <div class="title" id="songTitle">Summer Vibes</div>
    <div class="artist" id="songArtist">Babu Beats</div>
  </div>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="controls">
    <button class="btn" onclick="prev()">⏮</button>
    <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶</button>
    <button class="btn" onclick="next()">⏭</button>
  </div>

  <button id="loginBtn" onclick="loginWithPi()">👤 Login with Pi</button>
  <button id="piPayBtn" onclick="payWithPi()">🔓 Unlock Premium (1 Pi)</button>
  <div class="status" id="status">Not logged in • Free version</div>

  <div class="playlist">
    <div class="track active" onclick="playTrack(0)"><span>1. Summer Vibes</span><span>3:24</span></div>
    <div class="track" onclick="playTrack(1)"><span>2. Night City</span><span>2:58</span></div>
    <div class="track" onclick="playTrack(2)"><span>3. Pi Dreams</span><span>4:12</span></div>
  </div>
</div>

<script>
let piUser = null;
let isPremium = false;
let isPlaying = false;
const songs = [
  {title:"Summer Vibes", artist:"Babu Beats", emoji:"☀️"},
  {title:"Night City", artist:"Babu Beats", emoji:"🌃"},
  {title:"Pi Dreams", artist:"Babu Beats", emoji:"🚀"}
];
let cur = 0;

function updateUI(){
  document.getElementById('songTitle').innerText = songs[cur].title;
  document.getElementById('songArtist').innerText = songs[cur].artist;
  document.getElementById('cover').innerText = songs[cur].emoji;
  document.querySelectorAll('.track').forEach((t,i)=>t.classList.toggle('active', i===cur));
}
function playTrack(i){ cur=i; updateUI(); isPlaying=true; document.getElementById('playBtn').innerText="⏸"; }
function togglePlay(){ isPlaying=!isPlaying; document.getElementById('playBtn').innerText=isPlaying?"⏸":"▶"; }
function next(){ cur=(cur+1)%songs.length; updateUI(); }
function prev(){ cur=(cur-1+songs.length)%songs.length; updateUI(); }

// --- Pi PAYMENTS ---
async function loginWithPi(){
  try{
    document.getElementById('status').innerText="Connecting to Pi...";
    const scopes = ['username','payments'];
    const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
    piUser = auth.user;
    document.getElementById('loginBtn').innerText="✅ @"+piUser.username;
    document.getElementById('status').innerText="Logged in as @"+piUser.username+" • "+(isPremium?"Premium ✅":"Free");
  }catch(e){ alert("Pi Login failed: "+e.message); document.getElementById('status').innerText="Login failed - Open in Pi Browser"; }
}

function onIncompletePaymentFound(payment){
  console.log("Found incomplete payment:", payment);
}

async function payWithPi(){
  if(!piUser){ await loginWithPi(); if(!piUser) return; }
  try{
    document.getElementById('status').innerText="Creating payment...";
    const payment = await Pi.createPayment({
      amount: 1,
      memo: "Music Pi Premium - Unlock all songs",
      metadata: { type:"premium", app:"music-pi-app" }
    },{
      onReadyForServerApproval: function(paymentId){
        console.log("Ready for approval:", paymentId);
        document.getElementById('status').innerText="Approving payment...";
        // For Testnet without backend, we just log. In production you call your server.
      },
      onReadyForServerCompletion: function(paymentId, txid){
        console.log("Payment completed:", paymentId, txid);
        isPremium = true;
        document.getElementById('piPayBtn').innerText="✅ Premium Unlocked!";
        document.getElementById('piPayBtn').style.background="linear-gradient(90deg,#00ff88,#00cc66)";
        document.getElementById('status').innerText="Premium unlocked! Tx: "+txid.substring(0,10)+"...";
        alert("🎉 Payment Success! Premium unlocked for @"+piUser.username);
      },
      onCancel: function(paymentId){ document.getElementById('status').innerText="Payment cancelled"; },
      onError: function(error, payment){ alert("Payment error: "+error.message); document.getElementById('status').innerText="Payment error"; }
    });
  }catch(e){ alert("Error: "+e.message); }
}
</script>
</body>
</html>
